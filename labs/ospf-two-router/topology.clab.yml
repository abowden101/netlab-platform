# Two-router OSPF with a VLAN-aware switch.
#
# Addressing
#   r1 lo ......... 1.1.1.1/32      r2 lo ......... 2.2.2.2/32
#   r1-r2 ......... 10.0.12.0/30    (OSPF area 0, direct link)
#   VLAN 10 ....... 10.0.10.0/24    r1 is the gateway (10.0.10.1), h1 = .10
#   VLAN 20 ....... 10.0.20.0/24    r2 is the gateway (10.0.20.1), h2 = .10
#   OSPF advertises both VLAN networks, so h1 reaches h2 via r1 -> r2.
name: ospf-two-router
topology:
  nodes:
    r1:
      kind: frr
      image: quay.io/frrouting/frr-containerlab:10.7.1
      startup-config: r1.frr.conf
    r2:
      kind: frr
      image: quay.io/frrouting/frr-containerlab:10.7.1
      startup-config: r2.frr.conf
    sw1:
      kind: linux
      image: alpine:3.20
      binds:
        - sw1-setup.sh:/sw1-setup.sh:ro
      exec:
        - sh /sw1-setup.sh
    h1:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.0.10.10/24 dev eth1
        - ip route add default via 10.0.10.1
    h2:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.0.20.10/24 dev eth1
        - ip route add default via 10.0.20.1
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "sw1:eth1"]
    - endpoints: ["r2:eth2", "sw1:eth2"]
    - endpoints: ["sw1:eth3", "h1:eth1"]
    - endpoints: ["sw1:eth4", "h2:eth1"]
