apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: netlab-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: netlab-api
  template:
    metadata:
      labels:
        app: netlab-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
            - name: REDIS_URL
              value: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
            - name: MAX_LABS_PER_HOST
              value: "{{ .Values.api.env.maxLabsPerHost }}"
            - name: LAB_TTL_SECONDS
              value: "{{ .Values.api.env.labTtlSeconds }}"
            - name: LAB_IDLE_TIMEOUT_SECONDS
              value: "{{ .Values.api.env.labIdleTimeoutSeconds }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: password
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: uploads
              mountPath: /app/uploads
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: docker-sock
          hostPath:
            path: {{ .Values.api.dockerSocket }}
            type: Socket
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-uploads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app: netlab-web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: netlab-web
  template:
    metadata:
      labels:
        app: netlab-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          ports:
            - containerPort: {{ .Values.web.port }}
