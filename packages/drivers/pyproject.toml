[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netlab-drivers"
version = "0.1.0"
description = "Pluggable NOS drivers for netlab-platform"
requires-python = ">=3.12"
dependencies = ["netlab-shared"]

[tool.setuptools.packages.find]
where = ["."]
include = ["netlab_drivers*"]
